name: Deploy

on:
  push:
    branches: [main]
  # 이 workflow 는 검증 + 이미지 빌드까지만 한다. 운영(auth.bini59.dev)은 Oracle k3s 의 auth namespace 이고
  # bini59/homelab apps/auth/auth.yaml 에서 auth-app 이미지 태그(sha-<commit>)를 바꿔 커밋하면 Flux 가 배포한다.
  # 태그를 올리기 전에 새 이미지로 node apps/api/dist/db/migrate.js 를 한 번 실행한다(일회성 Job: env 는 Secret auth/env,
  # imagePullSecrets ghcr-pull). 이전 self-hosted deploy job 의 migrate → clients 확인 → 재기동 순서를 그대로 따른다.
  # (Postgres/Redis → SQLite 전환 runbook 은 docs/database.md 참고. 운영은 아직 Postgres 버전이다.)
  workflow_dispatch:

# 같은 시점 다중 배포 차단
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1) 이미지 빌드/푸시 (GitHub-Hosted ARM)
  validate:
    name: Validate workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Verify Admin bundle contains no server credentials
        run: |
          if rg -n -i 'ADMIN_PASSWORD_HASH|ADMIN_API_KEY|x-app-secret|scrypt-v1' apps/admin/dist; then
            echo 'Admin bundle contains a server credential marker'
            exit 1
          fi
      - run: pnpm typecheck

  build-and-push:
    name: Build & Push image to GHCR
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

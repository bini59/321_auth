services:
  auth-app:
    image: ${APP_IMAGE:-321_auth-auth-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 사용자·클라이언트·세션이 모두 이 SQLite 파일 하나에 있다. 백업은 docs/database.md 참고.
      DATABASE_PATH: /var/lib/321-auth/data/auth.db
      PROFILE_STORAGE_DIR: /var/lib/321-auth/profile
      PORT: 3000
    volumes:
      - authdata:/var/lib/321-auth/data
      - ${PROFILE_STORAGE_PATH:-/home/ubuntu/logos/profile}:/var/lib/321-auth/profile:rw
    # 호스트에서만 바인딩 — 외부 접근은 cloudflared tunnel이 담당
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - default
      - api-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  authdata:

networks:
  api-net:
    external: true
